<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/term.css">
    <title>Contact | Jannick</title>
</head>
<body>
    <site-header></site-header>

    <main>
    <h1><code>jannick@me:~$ contact</code></h1>

        <form id="contact-form" novalidate>
            <section>
                <label for="name">Your Name / Nickname</label>
                <input type="text" id="name" novalidate>
            </section>

            <section>
                <label for="message">Your Message</label>
                <textarea id="message" novalidate></textarea>
            </section>

            <section>
                <label for="contact-method">Preferred Contact Method</label>
                <select id="contact-method">
                    <option value="email">E-mail</option>
                    <option value="discord">Discord</option>
                </select>
            </section>

            <section id="email-field">
                <label for="email">Your E-mail</label>
                <input type="email" id="email" placeholder="abc@def.com">
            </section>

            <section id="discord-field" hidden>
                <label for="discord">Your Discord Username</label>
                <input type="text" id="discord" placeholder="@myuniquename">
            </section>

            <button type="submit">Send</button>
            <p id="form-status"></p>
        </form>
    </main>

    <site-footer></site-footer>
    <script src="/js/header.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/contact-form.js"></script>
</body>
</html>
