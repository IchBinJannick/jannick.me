name: "Migration Step"
description: Next Step on the way from Vanilla JS to TypeScript/React/Next.js.
title: "[Migration] "
labels: ["migration"]
body:
  - type: dropdown
    id: phase
    attributes:
      label: What Migrationsteps? / Phase
      options:
        - "Phase 1 – Vite Setup"
        - "Phase 1 – Convert JS-Datei to TS"
        - "Phase 2 – React Introduction"
        - "Phase 2 – Migrate Components to React"
        - "Phase 3 – Next.js"
        - "Other Tooling (ESLint, Prettier, CI...)"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What is being migrated/Introduced?
      placeholder: "e.g. header.js → Header.tsx as React-Component"
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: What could go wrong in the meantime?
      description: Thinking bevore something breaks.
      placeholder: "e.g. Navigation-Styling could move through new Classes-Names"
    validations:
      required: false

  - type: checkboxes
    id: process
    attributes:
      label: Migration-Workflow (see timeline)
      options:
        - label: Developed on another Branch
        - label: Vercel Preview-URL working without problems
        - label: Old version stays until Merge
        - label: After Merge: Chores!
